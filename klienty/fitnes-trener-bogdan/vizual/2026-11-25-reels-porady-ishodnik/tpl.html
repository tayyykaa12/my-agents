<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@600;700;800&display=block" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A0A0A;font-family:Montserrat}
.g{position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,#5C0A0Dcc 0,transparent 50%),radial-gradient(circle at 0% 100%,#5C0A0D99 0,transparent 50%)}
.h{position:absolute;left:70px;right:70px;font:700 118px/1 Oswald;text-transform:uppercase;color:#fff;text-align:center;z-index:20;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.r{color:#E1141B}
#fr{position:absolute;left:560px;top:760px;width:400px;height:860px;z-index:3}
#fr .body{position:absolute;inset:0;background:linear-gradient(90deg,#3a3a3a,#5a5a5a 40%,#2e2e2e);border-radius:30px;border:4px solid #222}
#fr .line{position:absolute;left:0;right:0;top:300px;height:6px;background:#1a1a1a}
#fr .light{position:absolute;inset:14px;border-radius:22px;background:radial-gradient(circle at 50% 30%,#fff8d8,#e9d9a0 40%,#7a6a3a);opacity:0}
#door{position:absolute;inset:0;background:linear-gradient(90deg,#4a4a4a,#6a6a6a 50%,#3a3a3a);border-radius:30px;border:4px solid #222;transform-origin:0% 50%}
#door .hd{position:absolute;right:30px;top:340px;width:14px;height:180px;background:#222;border-radius:8px}
#bog{position:absolute;left:-40px;bottom:0;width:760px;z-index:6;transform-origin:50% 100%}
.b{position:absolute;z-index:10;background:#fff;color:#0A0A0A;font:800 50px/1.15 Montserrat;padding:26px 36px;border-radius:40px;box-shadow:0 18px 40px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
.b:after{content:"";position:absolute;bottom:-22px;left:60px;border:22px solid transparent;border-top-color:#fff;border-bottom:0}
.b.red{background:#E1141B;color:#fff}.b.red:after{border-top-color:#E1141B}
#paw{position:absolute;z-index:15}
#plate{position:absolute;left:290px;top:880px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#f2f2f2 0 52%,#d9d9d9 53% 60%,#efefef 61%);z-index:12;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.add{position:absolute;z-index:13;background:#E1141B;color:#fff;font:800 44px Montserrat;padding:16px 28px;border-radius:999px;white-space:nowrap}
#nick{position:absolute;left:0;right:0;top:120px;text-align:center;font:700 40px Montserrat;color:#B3B3B3;z-index:20}
</style></head><body><div id="v"><div class="g"></div>
<div id="fr"><div class="body"></div><div class="line"></div><div class="light"></div><div id="door"><div class="hd"></div></div></div>
<img id="bog" src="bogdan.png">
<div class="h" id="t0" style="top:220px"><span class="r">П’ЯТЬ</span> ПОРАД.<div style="font-size:84px;margin-top:20px">З ОДНОГО ХОЛОДИЛЬНИКА.</div></div>
<div class="b" id="b1" style="left:480px;top:520px">Не їж після шостої!</div>
<div class="b red" id="b2" style="left:70px;top:680px">Тільки білок!</div>
<div class="b" id="b3" style="left:560px;top:840px">Хліб — це зло!</div>
<div class="b" id="b4" style="left:50px;top:975px">Фрукти ввечері шкодять!</div>
<div class="b red" id="b5" style="left:600px;top:1150px">Пий детокс!</div>
<div class="h" id="t1" style="top:220px">УСІ КАЖУТЬ <span class="r">РІЗНЕ.</span></div>
<div class="h" id="t2" style="top:500px;font-size:96px">ЛУНА — <span class="r">МОВЧИТЬ</span></div>
<svg id="paw" width="220" height="220" viewBox="0 0 100 100" style="left:430px;top:640px"><g fill="#E1141B"><ellipse cx="50" cy="66" rx="22" ry="18"/><ellipse cx="24" cy="40" rx="9" ry="12"/><ellipse cx="40" cy="26" rx="9" ry="12"/><ellipse cx="60" cy="26" rx="9" ry="12"/><ellipse cx="76" cy="40" rx="9" ry="12"/></g></svg>
<div class="h" id="t3" style="top:240px;font-size:100px">НЕ ПИТАЙ, ЩО <span style="text-decoration:line-through;text-decoration-color:#E1141B;text-decoration-thickness:10px">ЗАБОРОНЕНО.</span></div>
<div class="h" id="t4" style="top:240px;font-size:100px">ПИТАЙ, ЩО МОЖНА <span class="r">ДОДАТИ</span> ДО ТАРІЛКИ</div>
<div id="plate"></div>
<div class="add" id="a1" style="left:170px;top:930px">+ овочі</div>
<div class="add" id="a2" style="left:690px;top:1000px">+ білок</div>
<div class="add" id="a3" style="left:240px;top:1320px">+ крупа</div>
<div class="add" id="a4" style="left:640px;top:1300px">+ смак</div>
<div class="h" id="t5" style="top:300px;font-size:128px">ПЕРЕШЛИ ТОМУ, ХТО ТЕЖ <span class="r">ПЛУТАЄТЬСЯ</span></div>
<svg id="plane" width="200" height="200" viewBox="0 0 24 24" style="position:absolute;left:760px;top:820px;z-index:20"><path fill="#E1141B" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
<div id="nick">@konoplyanik2.0</div>
</div>
<script>
const S=__S__, END=__END__; window.END=END;
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)); const eo=x=>1-Math.pow(1-cl(x),3); const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function vis(el,a,b,t,fi=0.25,fo=0.25){let o=cl((t-a)/fi)*(1-cl((t-(b-fo))/fo)); el.style.opacity=o; return o}
function setT(t){
 const doorOpen=eo((t-0.2)/0.6); const fridgeOut=cl((t-(S[8]-0.4))/0.5);
 $('door').style.transform=`perspective(1200px) rotateY(${-100*doorOpen}deg)`;
 document.querySelector('#fr .light').style.opacity=doorOpen*0.95;
 $('fr').style.opacity=1-fridgeOut; $('fr').style.transform=`translateX(${fridgeOut*300}px)`;
 let press=cl((t-S[1])/(S[6]-S[1]));
 let sh=(t>S[5]&&t<S[6])?Math.sin(t*60)*8:0;
 let bout=cl((t-(S[8]-0.4))/0.5);
 $('bog').style.transform=`translateX(${sh - bout*800}px) scale(${1-0.12*press})`;
 $('bog').style.opacity=1-bout;
 if(t>S[10]-0.3){let bi=eo((t-(S[10]-0.3))/0.6); $('bog').style.transform=`translateX(${-800+800*bi+200}px) scale(.85)`; $('bog').style.opacity=bi;}
 vis($('t0'),0.15,S[1]+0.1,t); $('t0').style.transform=`scale(${0.7+0.3*back((t-0.15)/0.4)})`;
 for(let i=1;i<=5;i++){const el=$('b'+i); const a=S[i]-0.1; let pop=back((t-a)/0.35);
   let gone=cl((t-(S[8]-0.5))/0.45); let wob=Math.sin((t+i)*3)*6; let crowd=eo((t-S[6]+0.2)/0.4);
   el.style.opacity=(t>=a?1:0)*(1-gone)*(1-0.55*crowd);
   el.style.transform=`scale(${pop*(1-gone*0.5)}) translateY(${wob + crowd*330 + gone*900}px) rotate(${(i%2?-4:4)+gone*40*(i%2?-1:1)}deg)`;}
 vis($('t1'),S[6]-0.1,S[8]-0.3,t); $('t1').style.transform=`scale(${0.8+0.2*back((t-S[6]+0.1)/0.35)})`;
 vis($('t2'),S[7]-0.1,S[8]-0.3,t);
 vis($('paw'),S[7]-0.1,S[8]-0.3,t); $('paw').style.transform=`scale(${back((t-S[7]+0.1)/0.4)}) rotate(${Math.sin(t*4)*10}deg)`;
 vis($('t3'),S[8]+0.05,S[9]-0.05,t,0.25,0.2);
 vis($('t4'),S[9],S[10]-0.2,t,0.2,0.25);
 vis($('plate'),S[8]+0.2,S[10]-0.2,t,0.4,0.3); $('plate').style.transform=`scale(${0.6+0.4*back((t-S[8]-0.2)/0.5)})`;
 ['a1','a2','a3','a4'].forEach((id,k)=>{const a=S[9]+0.25+k*0.45; vis($(id),a,S[10]-0.2,t,0.2,0.25); $(id).style.transform=`scale(${back((t-a)/0.3)})`;});
 vis($('t5'),S[10]-0.1,END+1,t); $('t5').style.transform=`translateY(${(1-eo((t-S[10]+0.1)/0.4))*80}px)`;
 vis($('plane'),S[10]+0.3,END+1,t); $('plane').style.transform=`translate(${Math.max(0,t-S[10]-0.3)*60}px,${-Math.max(0,t-S[10]-0.3)*40}px)`;
}
setT(0);
</script></body></html>
